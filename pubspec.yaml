name: delight_and_dine
description: A complete flutter mobile application for order taking at Delight and Dine restaurant.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  http: ^1.1.0
  intl: ^0.18.0
  google_fonts: ^5.1.0
  cached_network_image: ^3.2.3
  shared_preferences: ^2.0.20
  image_picker: ^0.8.8
  permission_handler: ^11.4.3
  firebase_core: ^2.21.0
  firebase_auth: ^4.11.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.2.0
  firebase_messaging: ^14.6.0
  stripe_flutter: ^7.1.0
  razorpay_flutter: ^1.3.7
  geolocator: ^9.0.2
  google_maps_flutter: ^2.4.1
  flutter_local_notifications: ^15.1.0
  table_calendar: ^3.0.9
  charts_flutter: ^0.12.0
  uuid: ^4.0.0
  connectivity_plus: ^5.0.0
  package_info_plus: ^4.1.0
  url_launcher: ^6.1.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600